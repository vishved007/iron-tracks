name: Extract project archive
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files to repo root
        run: |
          set -e
          unzip -o iron-tracks-project-fixed.zip -d /tmp/ironproj
          SRC=/tmp/ironproj
          if [ ! -f "$SRC/project.godot" ]; then
            SUBDIR=$(find "$SRC" -maxdepth 3 -name project.godot -print -quit | xargs -r dirname)
            if [ -n "$SUBDIR" ]; then SRC="$SUBDIR"; fi
          fi
          echo "Extracting from: $SRC"
          ls -la "$SRC"
          shopt -s dotglob
          cp -rf "$SRC"/* .
          rm -f iron-tracks-project-fixed.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract Iron Tracks project files to repo root" || echo "Nothing to commit"
          git push
