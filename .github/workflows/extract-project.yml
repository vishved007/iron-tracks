name: Extract project archive
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files to repo root
        run: |
          set -e
          unzip -o iron-tracks-project-fixed.zip -d /tmp/ironproj
          SRC=/tmp/ironproj
          if [ ! -f "$SRC/project.godot" ]; then
            SUBDIR=$(find "$SRC" -maxdepth 3 -name project.godot -print -quit | xargs -r dirname)
            if [ -n "$SUBDIR" ]; then SRC="$SUBDIR"; fi
          fi
          echo "Extracting from: $SRC"
          ls -la "$SRC"
          shopt -s dotglob
          for f in "$SRC"/*; do
            base=$(basename "$f")
            if [ "$base" = ".github" ]; then
              echo "Skipping .github (workflow files will be added via web UI)"
              continue
            fi
            cp -rf "$f" .
          done
          rm -f iron-tracks-project-fixed.zip
          echo "===== android.yml content (for web UI commit) ====="
          cat "$SRC/.github/workflows/android.yml"
          echo "===== end android.yml ====="
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract Iron Tracks project files to repo root" || echo "Nothing to commit"
          git push
