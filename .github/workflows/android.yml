name: "Build Android APK"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: "Export Godot 4.3 Android APK"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "Setup Godot Export Templates & Environment"
        run: |
          mkdir -p build/android
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -rn /root/.local/share/godot/export_templates/4.3.stable/* "$HOME/.local/share/godot/export_templates/4.3.stable/" || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi

      - name: "Initialize Godot Project & Import Assets"
        run: |
          godot --headless --editor --quit || true

      - name: "Configure Java SDK path for Android export"
        run: |
          set -e
          echo "--- Locating a JDK containing javac ---"
          JDK_DIR=""
          if command -v javac >/dev/null 2>&1; then
            JDK_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          if [ -z "$JDK_DIR" ] || [ ! -x "$JDK_DIR/bin/javac" ]; then
            for cand in /usr/lib/jvm/*; do
              if [ -x "$cand/bin/javac" ]; then
                JDK_DIR="$cand"
                break
              fi
            done
          fi
          echo "JDK_DIR=$JDK_DIR"
          if [ -z "$JDK_DIR" ] || [ ! -x "$JDK_DIR/bin/javac" ]; then
            echo "ERROR: no JDK containing javac was found in the container"
            exit 1
          fi
          echo "--- Ensuring Godot editor settings file exists ---"
          godot --headless --editor --quit >/dev/null 2>&1 || true
          SETTINGS_FILE="$(find "$HOME/.config/godot" /root/.config/godot -maxdepth 1 -iname '*editor_settings*' 2>/dev/null | head -n 1)"
          echo "SETTINGS_FILE=$SETTINGS_FILE"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Godot editor settings file was not found"
            exit 1
          fi
          echo "--- Writing export/android/java_sdk_path into editor settings (.tres INI-style) ---"
          NEW_LINE="export/android/java_sdk_path = \"$JDK_DIR\""
          if grep -q '^export/android/java_sdk_path' "$SETTINGS_FILE"; then
            sed -i "s|^export/android/java_sdk_path.*|$NEW_LINE|" "$SETTINGS_FILE"
          else
            printf '%s\n' "$NEW_LINE" >> "$SETTINGS_FILE"
          fi
          echo "--- Verification ---"
          grep -a "java_sdk_path" "$SETTINGS_FILE" || echo "WARNING: java_sdk_path not found in settings file"

      - name: "Export Android Debug APK"
        run: |
          godot -v --headless --export-debug "Android" build/android/IronTracks.apk

      - name: "Verify APK Output"
        run: |
          ls -lh build/android/
          if [ ! -f "build/android/IronTracks.apk" ]; then
            echo "ERROR: build/android/IronTracks.apk was not generated!"
            exit 1
          fi

      - name: "Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: IronTracks-Android-APK
          path: build/android/IronTracks.apk
          if-no-files-found: error
